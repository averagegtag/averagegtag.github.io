<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AverageGTAG!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: #ff3b3b;
      overflow-x: hidden;
    }

    /* Animated dark red pulse background */
    @keyframes pulseBG {
      0% { background-color: #1a0000; }
      50% { background-color: #300000; }
      100% { background-color: #1a0000; }
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,0,0,0.12), transparent 70%);
      animation: pulseBG 6s infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 100vh;
      background: #200000;
      color: #ff3b3b;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      box-shadow: 2px 0 10px rgba(255,0,0,0.25);
    }
    .sidebar a {
      color: #ff5b5b;
      text-decoration: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* Content */
    .content {
      margin-left: 170px;
      padding: 0;
    }

    /* FULLSCREEN INTRO */
    #home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }
    #home h1 {
      font-size: 72px;
      margin-bottom: 20px;
      color: #ff4444;
    }
    #home p {
      font-size: 30px;
      max-width: 800px;
      line-height: 1.4;
    }

    /* PROJECTS */
    #projects {
      padding: 80px 40px;
    }
    #projects h2 {
      font-size: 50px;
      margin-bottom: 40px;
    }
    .project-list a {
      display: block;
      margin-bottom: 20px;
      font-size: 26px;
      color: #ff6666;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <a href="#home">Home</a>
  <a href="#projects">Projects</a>
</div>

<div class="content">
  <section id="home">
    <h1>averagegtag's project site!</h1>
    <p>Scroll down or click "Projects" (to the left) to find my projects!</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <div class="project-list">
      <a href="petrifiedprimates.html">Petrified Primates</a>
      <!-- Add more here -->
    </div>
  </section>
</div>

</body>
