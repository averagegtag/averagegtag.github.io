<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>averagegtag!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 100vh;
      background: #222;
      color: white;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      cursor: pointer;
    }

    /* Content */
    .content {
      margin-left: 170px;
      padding: 30px;
    }

    .section {
      padding: 60px 0;
    }

    .project-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    .project-card a {
      text-decoration: none;
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a onclick="scrollToSection('home')">Home</a>
    <a onclick="scrollToSection('projects')">Projects</a>
  </div>

  <div class="content">
    <div id="home" class="section">
      <h1>Welcome to My Projects</h1>
      <p>This is where I show off the things I make. Scroll down to see the projects!</p>
    </div>

    <div id="projects" class="section">
      <h2>Projects</h2>

      <div class="project-card">
        <h3>Petrified Primates</h3>
        <p>A spooky, fun game I'm making.</p>
        <a href="petrifiedprimates.html">View Project</a>
      </div>

    </div>
  </div>

  <script>
    function scrollToSection(id) {
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
